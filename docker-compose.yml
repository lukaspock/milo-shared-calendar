services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedcal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharedcal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sharedcal
      PORT: 3000
      JWT_SECRET: change_me_in_production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
