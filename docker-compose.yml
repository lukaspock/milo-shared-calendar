services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharedcal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharedcal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sharedcal
      PORT: 3000
      JWT_SECRET: change_me_in_production
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: 583283682704-ru7t2guho8bd8p42gmi1u6c8ruq9mq3a.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_IOS_CLIENT_ID: 583283682704-ethnu73r7o8rblkvra89qsibo0tlq7pp.apps.googleusercontent.com
      FROM_EMAIL: lukaspock.dev@gmail.com
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
