# SharedCal — GitLab CI/CD pipeline
#
# Pipeline overview:
#   lint   → type-check backend (Bun/TS) + format-check & analyze Flutter frontend
#   test   → run backend & Flutter tests (with JUnit reports + coverage)
#            + SAST (secret detection, semgrep) runs here in parallel with tests
#   deploy → publish Flutter web to GitLab Pages + trigger Render backend deploy
#            + create GitLab Release on semver tags
#
# Required CI/CD variable (Settings → CI/CD → Variables):
#   RENDER_DEPLOY_HOOK   The Render service "Deploy Hook" URL. Mark it Masked.
#                        Render dashboard → your service → Settings → Deploy Hook.
#
# GitLab Pages URL (available after first successful main pipeline):
#   https://htlpinkafeld.gitlab.io/informatik/2025-26-4bhif/wmc/shared-calendar/flutterprojectvibecoding/
#
# Compute minutes: disable GitLab shared runners in project settings
# (Settings → CI/CD → Runners → uncheck "Enable shared runners for this project")
# so all jobs run exclusively on the local MacBook runner at zero cost.

stages:
  - lint
  - test
  - deploy
  - release

# Don't let git clean remove gitignored build artifacts (e.g. frontend/build/ios/SourcePackages).
# The default "-ffdx" (with -x) deletes ignored files too, which causes "Directory not empty"
# errors on the local shell runner when Swift PM leaves behind locked directories.
variables:
  GIT_CLEAN_FLAGS: -ffd

# Avoid duplicate pipelines: run for merge requests, and for branch pushes that
# don't already have an open MR (prevents the "detached + branch" double pipeline).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Reusable templates
# ---------------------------------------------------------------------------

.bun:
  image: oven/bun:1
  variables:
    # Throwaway secrets used only by unit tests — not real production values.
    JWT_SECRET: "ci-test-jwt-secret-not-used-in-prod"
    ENCRYPTION_KEY: "ci-test-encryption-key-32-chars!"
  cache:
    key:
      files:
        - backend/bun.lock
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - bun install --frozen-lockfile

.flutter:
  image: ghcr.io/cirruslabs/flutter:stable
  variables:
    PUB_CACHE: "$CI_PROJECT_DIR/frontend/.pub-cache"
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - frontend/.pub-cache/
  before_script:
    - cd frontend
    - flutter pub get

# ---------------------------------------------------------------------------
# Lint / static analysis
# ---------------------------------------------------------------------------

backend:typecheck:
  extends: .bun
  stage: lint
  script:
    - bunx tsc --noEmit

frontend:analyze:
  extends: .flutter
  stage: lint
  script:
    # Non-blocking format check — warns but won't fail the pipeline. To enforce
    # it, drop the `|| ...` and the code must be `dart format`-clean first.
    - dart format --output=none --set-exit-if-changed . || echo "⚠️  Some files are not formatted — run 'dart format .' and commit."
    - flutter analyze

# ---------------------------------------------------------------------------
# Tests + SAST (all run in the same stage — SAST in parallel with tests,
# saving one full pipeline stage of waiting time)
# ---------------------------------------------------------------------------

backend:test:
  extends: .bun
  stage: test
  script:
    - bun test

frontend:test:
  extends: .flutter
  stage: test
  coverage: '/lines\s*\.*:\s*(\d+\.\d+)%/'
  script:
    - dart pub global activate junitreport
    # Single test run: capture the exit code so we don't run the suite twice.
    # --reporter json is written to a file first (avoids broken-pipe with --coverage).
    - flutter test --coverage --reporter json > test-output.json; TEST_EXIT=$?
    - $PUB_CACHE/bin/tojunit < test-output.json > junit-report.xml
    # Print coverage summary for the GitLab coverage regex to parse
    - |
      total=$(grep -c "^DA:" coverage/lcov.info || echo 0)
      hit=$(grep -c "^DA:[0-9]*,[^0]" coverage/lcov.info || echo 0)
      if [ "$total" -gt 0 ]; then
        pct=$(echo "scale=2; $hit * 100 / $total" | bc)
        echo "lines...: $pct%"
      fi
    - exit $TEST_EXIT
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: frontend/junit-report.xml
    paths:
      - frontend/coverage/

secret_detection:
  stage: test
  dependencies: []
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --no-git --config .gitleaks.toml
  allow_failure: false

semgrep-sast:
  stage: test
  dependencies: []
  image: semgrep/semgrep:latest
  script:
    # Scan only the TypeScript backend — Dart is not supported by semgrep
    - semgrep scan --config=auto --error backend/src/
  allow_failure: true

# ---------------------------------------------------------------------------
# Deploy — GitLab Pages + Render backend (main only)
# ---------------------------------------------------------------------------

pages:
  extends: .flutter
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - flutter build web --release
    - mv build/web $CI_PROJECT_DIR/public
  artifacts:
    expire_in: 7 days
    paths:
      - public

deploy:render:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://api.milocalendar.tech
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK" ]; then
        echo "RENDER_DEPLOY_HOOK is not set — Render auto-deploys on push, so skipping explicit trigger."
        exit 0
      fi
    - echo "Triggering Render deploy…"
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
    - echo "Render deploy triggered."

release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SharedCal $CI_COMMIT_TAG"
    description: |
      ## SharedCal $CI_COMMIT_TAG

      Released from commit $CI_COMMIT_SHORT_SHA on branch $CI_COMMIT_REF_NAME.

      **[Flutter Web App](https://htlpinkafeld.gitlab.io/informatik/2025-26-4bhif/wmc/shared-calendar/flutterprojectvibecoding/)**
      **[Backend API](https://api.milocalendar.tech)**
    assets:
      links:
        - name: "Flutter Web App"
          url: "https://htlpinkafeld.gitlab.io/informatik/2025-26-4bhif/wmc/shared-calendar/flutterprojectvibecoding/"
        - name: "Backend API"
          url: "https://api.milocalendar.tech"
